<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26A69A"/><stop offset="1" stop-color="#00695C"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA726"/><stop offset="1" stop-color="#EF6C00"/></linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8F00"/><stop offset="1" stop-color="#D84315"/></linearGradient>
    <linearGradient id="cash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66BB6A"/><stop offset="1" stop-color="#2E7D32"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#42A5F5"/><stop offset="1" stop-color="#1565C0"/></linearGradient>
  </defs><rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- tiền giấy ló ra -->
  <g transform="rotate(-8 512 360)">
    <rect x="300" y="250" width="380" height="200" rx="18" fill="url(#cash)"/>
    <circle cx="490" cy="350" r="46" fill="none" stroke="#E8F5E9" stroke-width="12" opacity=".8"/>
    <text x="490" y="368" font-family="Arial" font-weight="bold" font-size="56" fill="#E8F5E9" text-anchor="middle">đ</text>
  </g>
  <!-- thẻ ngân hàng ló ra -->
  <g transform="rotate(7 600 330)">
    <rect x="430" y="270" width="330" height="200" rx="22" fill="url(#card)"/>
    <rect x="470" y="320" width="60" height="44" rx="8" fill="#FFE082"/>
    <rect x="470" y="400" width="200" height="16" rx="8" fill="#BBDEFB" opacity=".9"/>
  </g>
  <!-- thân ví -->
  <rect x="200" y="400" width="624" height="400" rx="72" fill="url(#body)"/>
  <rect x="200" y="400" width="624" height="400" rx="72" fill="none" stroke="#5D4037" stroke-opacity=".25" stroke-width="6"/>
  <!-- đường chỉ khâu -->
  <rect x="236" y="436" width="552" height="328" rx="48" fill="none" stroke="#FFE0B2" stroke-width="7" stroke-dasharray="22 16" opacity=".85"/>
  <!-- nắp ví và khuy bấm -->
  <path d="M600 520 h224 v180 h-224 a90 90 0 0 1 0 -180 z" fill="url(#flap)"/>
  <circle cx="618" cy="610" r="34" fill="#FFF3E0"/>
  <circle cx="618" cy="610" r="17" fill="#E65100"/>
  <!-- tia sáng "ma thuật" -->
  <path transform="translate(250 300)" d="M0 -78 L18 -18 L78 0 L18 18 L0 78 L-18 18 L-78 0 L-18 -18 Z" fill="#FFF59D"/>
  <path transform="translate(820 250)" d="M0 -44 L10 -10 L44 0 L10 10 L0 44 L-10 10 L-44 0 L-10 -10 Z" fill="#FFF59D" opacity=".9"/>
</svg>